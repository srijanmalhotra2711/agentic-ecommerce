version: '3.8'

# ============================================================
# agentic-commerce — local development stack
#
# Design notes:
#   - All services build from REPO ROOT context so they can include the
#     shared TypeScript package. Each service's Dockerfile knows the
#     monorepo layout.
#   - Each Postgres has its migrations mounted at /docker-entrypoint-initdb.d,
#     so on first startup Postgres auto-runs them. No manual migration step.
#   - The AI database uses `pgvector/pgvector:pg16` — same Postgres but with
#     the vector extension preinstalled.
#   - Healthchecks are wired into depends_on so services start in the right
#     order without race conditions.
#   - Ollama lives in its own container with a persistent volume for models.
# ============================================================

services:

  # ---------- Infrastructure ----------

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: ac-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks: [ac-net]
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: ac-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    networks: [ac-net]
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  ollama:
    image: ollama/ollama:latest
    container_name: ac-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks: [ac-net]
    # On first run, you must pull the models. See README "Ollama setup" section.
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ---------- Databases (one per service) ----------

  pg-users:
    image: postgres:16-alpine
    container_name: ac-pg-users
    environment:
      POSTGRES_DB: users_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5441:5432"]
    volumes:
      - pg-users-data:/var/lib/postgresql/data
      - ./services/user-service/migrations:/docker-entrypoint-initdb.d:ro
    networks: [ac-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d users_db"]
      interval: 5s
      timeout: 3s
      retries: 5

  pg-products:
    image: postgres:16-alpine
    container_name: ac-pg-products
    environment:
      POSTGRES_DB: products_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5442:5432"]
    volumes:
      - pg-products-data:/var/lib/postgresql/data
      - ./services/product-service/migrations:/docker-entrypoint-initdb.d:ro
    networks: [ac-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d products_db"]
      interval: 5s
      timeout: 3s
      retries: 5

  pg-orders:
    image: postgres:16-alpine
    container_name: ac-pg-orders
    environment:
      POSTGRES_DB: orders_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5443:5432"]
    volumes:
      - pg-orders-data:/var/lib/postgresql/data
      - ./services/order-service/migrations:/docker-entrypoint-initdb.d:ro
    networks: [ac-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d orders_db"]
      interval: 5s
      timeout: 3s
      retries: 5

  pg-ai:
    image: pgvector/pgvector:pg16
    container_name: ac-pg-ai
    environment:
      POSTGRES_DB: ai_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5444:5432"]
    volumes:
      - pg-ai-data:/var/lib/postgresql/data
      - ./services/ai-service/migrations:/docker-entrypoint-initdb.d:ro
    networks: [ac-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_db"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ---------- Microservices ----------

  user-service:
    build:
      context: .
      dockerfile: services/user-service/Dockerfile
    container_name: ac-user-service
    ports: ["3001:3001"]
    environment:
      NODE_ENV: production
      PORT: 3001
      LOG_LEVEL: info
      DATABASE_URL: postgresql://postgres:postgres@pg-users:5432/users_db
      KAFKA_BROKERS: kafka:29092
      JWT_SECRET: dev-secret-change-in-prod-this-is-32-chars-min
    depends_on:
      pg-users: { condition: service_healthy }
      kafka: { condition: service_healthy }
    networks: [ac-net]
    restart: unless-stopped

  product-service:
    build:
      context: .
      dockerfile: services/product-service/Dockerfile
    container_name: ac-product-service
    ports: ["3002:3002"]
    environment:
      NODE_ENV: production
      PORT: 3002
      LOG_LEVEL: info
      DATABASE_URL: postgresql://postgres:postgres@pg-products:5432/products_db
      KAFKA_BROKERS: kafka:29092
    depends_on:
      pg-products: { condition: service_healthy }
      kafka: { condition: service_healthy }
    networks: [ac-net]
    restart: unless-stopped

  order-service:
    build:
      context: .
      dockerfile: services/order-service/Dockerfile
    container_name: ac-order-service
    ports: ["3003:3003"]
    environment:
      NODE_ENV: production
      PORT: 3003
      LOG_LEVEL: info
      DATABASE_URL: postgresql://postgres:postgres@pg-orders:5432/orders_db
      KAFKA_BROKERS: kafka:29092
      PRODUCT_SERVICE_URL: http://product-service:3002
    depends_on:
      pg-orders: { condition: service_healthy }
      kafka: { condition: service_healthy }
      product-service: { condition: service_started }
    networks: [ac-net]
    restart: unless-stopped

  ai-service:
    build:
      context: .
      dockerfile: services/ai-service/Dockerfile
    container_name: ac-ai-service
    ports: ["8000:8000"]
    environment:
      ENV: production
      PORT: 8000
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql://postgres:postgres@pg-ai:5432/ai_db
      KAFKA_BROKERS: kafka:29092
      OLLAMA_URL: http://ollama:11434
      EMBEDDING_MODEL: nomic-embed-text
      LLM_MODEL: llama3.2:3b
      PRODUCT_SERVICE_URL: http://product-service:3002
      ORDER_SERVICE_URL: http://order-service:3003
    depends_on:
      pg-ai: { condition: service_healthy }
      kafka: { condition: service_healthy }
      ollama: { condition: service_healthy }
    networks: [ac-net]
    restart: unless-stopped

volumes:
  pg-users-data:
  pg-products-data:
  pg-orders-data:
  pg-ai-data:
  ollama-data:

networks:
  ac-net:
    driver: bridge
